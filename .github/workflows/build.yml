
name: Build Days Gone Plugin

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Instalar dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang llvm lld make git wget curl tar p7zip-full

      - name: Extrair LibOrbisRender
        run: |
          if [ -f liborbisrender-master.7z ]; then
            mkdir -p "$RUNNER_TEMP/liborbisrender"
            7z x liborbisrender-master.7z -o"$RUNNER_TEMP/liborbisrender" -y
          fi

      - name: Diagnosticar LibOrbisRender
        run: |
          mkdir -p "$RUNNER_TEMP/liborbisrender"
          REPORT="$RUNNER_TEMP/liborbisrender-diagnostic.txt"
          {
            echo "=== Raiz extraida ==="
            find "$RUNNER_TEMP/liborbisrender" -maxdepth 3 -type d | sort
            echo
            echo "=== Arquivos de build e bibliotecas ==="
            find "$RUNNER_TEMP/liborbisrender" -type f \( \
              -name 'CMakeLists.txt' -o \
              -name 'Makefile' -o \
              -name '*.vcxproj' -o \
              -name '*.sln' -o \
              -name '*.a' -o \
              -name '*.lib' -o \
              -name '*.o' -o \
              -name '.gitmodules' \
            \) -print | sort
            echo
            echo "=== README encontrados ==="
            find "$RUNNER_TEMP/liborbisrender" -maxdepth 4 -iname 'README*' -type f -print | sort
            echo
            echo "=== Total de arquivos ==="
            find "$RUNNER_TEMP/liborbisrender" -type f | wc -l
          } | tee "$REPORT"

      - name: Salvar diagnostico LibOrbisRender
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LibOrbisRender-Diagnostic
          path: ${{ runner.temp }}/liborbisrender-diagnostic.txt
          if-no-files-found: warn

      - name: Baixar OpenOrbis
        run: |
          mkdir -p "$RUNNER_TEMP/OpenOrbis"
          curl -fL "https://github.com/OpenOrbis/OpenOrbis-PS4-Toolchain/releases/download/v0.5.4/toolchain-llvm-18.tar.gz" -o "$RUNNER_TEMP/toolchain.tar.gz"
          tar -xzf "$RUNNER_TEMP/toolchain.tar.gz" -C "$RUNNER_TEMP/OpenOrbis"

      - name: Configurar toolchain
        run: |
          HEADER=$(find "$RUNNER_TEMP/OpenOrbis" -type f -path '*/include/sys/errno.h' -print -quit)
          if [ -z "$HEADER" ]; then
            echo "errno.h nao encontrado"
            exit 1
          fi
          ROOT="${HEADER%/include/sys/errno.h}"
          echo "OO_PS4_TOOLCHAIN=$ROOT" >> "$GITHUB_ENV"
          echo "$ROOT/bin/linux" >> "$GITHUB_PATH"

      - name: Baixar GoldHEN SDK
        run: |
          git clone --depth 1 https://github.com/GoldHEN/GoldHEN_Plugins_SDK.git "$RUNNER_TEMP/GoldHEN_SDK"
          echo "GOLDHEN_SDK=$RUNNER_TEMP/GoldHEN_SDK" >> "$GITHUB_ENV"

      - name: Baixar estrutura GoldHEN
        run: |
          git clone --depth 1 https://github.com/GoldHEN/GoldHEN_Plugins_Repository.git "$RUNNER_TEMP/GoldHEN_Plugins"

      - name: Preparar plugin C++
        run: |
          set -e

          test -f source/main.cpp
          test -f source/menu.cpp
          test -f source/menu.hpp
          test -f source/pad.h
          test -f source/pad.cpp

          ROOT="$RUNNER_TEMP/GoldHEN_Plugins"
          TEMPLATE="$ROOT/plugin_src/plugin_template"

          test -d "$TEMPLATE"
          test -f "$TEMPLATE/Makefile"

          find "$ROOT/plugin_src" -mindepth 1 -maxdepth 1 -type d ! -name plugin_template -exec rm -rf {} +

          mkdir -p "$TEMPLATE/source"
          mkdir -p "$TEMPLATE/include"

          rm -f "$TEMPLATE/source/main.c"
          rm -f "$TEMPLATE/source/menu.c"

          cp source/main.cpp "$TEMPLATE/source/main.cpp"
          cp source/menu.cpp "$TEMPLATE/source/menu.cpp"
          cp source/pad.cpp "$TEMPLATE/source/pad.cpp"
          cp source/pad.h "$TEMPLATE/include/pad.h"
          cp source/menu.hpp "$TEMPLATE/include/menu.hpp"

          sed -i 's/-lSceSysmodule/-lSceSysmodule -lScePad -lSceUserService/' "$TEMPLATE/Makefile"

          mv "$TEMPLATE" "$ROOT/plugin_src/DaysGoneSpawner"

      - name: Compilar PRX
        run: |
          make -C "$RUNNER_TEMP/GoldHEN_Plugins"

      - name: Salvar plugin
        uses: actions/upload-artifact@v4
        with:
          name: DaysGoneSpawner
          path: ${{ runner.temp }}/GoldHEN_Plugins/bin/plugins/prx_final/DaysGoneSpawner.prx
          if-no-files-found: error
          
