
name: Build DaysGoneSpawner

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Instalar dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld llvm make curl jq tar git

      - name: Baixar OpenOrbis
        run: |
          URL="https://api.github.com/repos/OpenOrbis/OpenOrbis-PS4-Toolchain/releases/tags/v0.5.4"
          curl -fsSL "$URL" -o release.json
          DOWNLOAD=$(jq -r '.assets[] | select(.name == "toolchain-llvm-18.tar.gz") | .browser_download_url' release.json)

          test -n "$DOWNLOAD"
          test "$DOWNLOAD" != "null"

          mkdir -p "$RUNNER_TEMP/oo"
          curl -fL "$DOWNLOAD" -o toolchain.tar.gz
          tar -xzf toolchain.tar.gz --strip-components=2 -C "$RUNNER_TEMP/oo"

          echo "OO_PS4_TOOLCHAIN=$RUNNER_TEMP/oo" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/oo/bin/linux" >> "$GITHUB_PATH"

      - name: Baixar GoldHEN SDK
        run: |
          git clone --depth 1 https://github.com/GoldHEN/GoldHEN_Plugins_SDK.git "$RUNNER_TEMP/GoldHEN_SDK"
          echo "GOLDHEN_SDK=$RUNNER_TEMP/GoldHEN_SDK" >> "$GITHUB_ENV"
          make -C "$RUNNER_TEMP/GoldHEN_SDK"

      - name: Baixar estrutura oficial
        run: |
          git clone --depth 1 https://github.com/GoldHEN/GoldHEN_Plugins_Repository.git "$RUNNER_TEMP/GoldHEN_Plugins"

      - name: Preparar plugin
        run: |
          test -f source/main.c

          ROOT="$RUNNER_TEMP/GoldHEN_Plugins"
          TEMPLATE="$ROOT/plugin_src/plugin_template"

          find "$ROOT/plugin_src" -mindepth 1 -maxdepth 1 -type d ! -name plugin_template -exec rm -rf {} +

          cp source/main.c "$TEMPLATE/source/main.c"

          sed -i 's/-lSceSysmodule$/-lSceSysmodule -lScePad -lSceUserService/' "$TEMPLATE/Makefile"

          grep 'LIBS :=' "$TEMPLATE/Makefile"

          mv "$TEMPLATE" "$ROOT/plugin_src/DaysGoneSpawner"

      - name: Compilar PRX
        run: |
          make -C "$RUNNER_TEMP/GoldHEN_Plugins"

          find "$RUNNER_TEMP/GoldHEN_Plugins/bin/plugins/prx_final" -name "*.prx" -type f

          test -f "$RUNNER_TEMP/GoldHEN_Plugins/bin/plugins/prx_final/DaysGoneSpawner.prx"

      - name: Salvar plugin
        uses: actions/upload-artifact@v4
        with:
          name: DaysGoneSpawner-PRX
          path: ${{ runner.temp }}/GoldHEN_Plugins/bin/plugins/prx_final/DaysGoneSpawner.prx
          if-no-files-found: error
          
