
name: Build Days Gone Plugin

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Instalar dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang llvm lld make git wget curl tar

      - name: Baixar OpenOrbis completo
        run: |
          mkdir -p "$RUNNER_TEMP/OpenOrbis"
          curl -fL "https://github.com/OpenOrbis/OpenOrbis-PS4-Toolchain/releases/download/v0.5.4/toolchain-llvm-18.tar.gz" -o "$RUNNER_TEMP/toolchain.tar.gz"
          tar -xzf "$RUNNER_TEMP/toolchain.tar.gz" -C "$RUNNER_TEMP/OpenOrbis"

      - name: Verificar OpenOrbis
        run: |
          HEADER=$(find "$RUNNER_TEMP/OpenOrbis" -type f -path '*/include/sys/errno.h' -print -quit)
          if [ -z "$HEADER" ]; then
            echo "errno.h nao encontrado"
            find "$RUNNER_TEMP/OpenOrbis" -maxdepth 6 -type d
            exit 1
          fi
          ROOT="${HEADER%/include/sys/errno.h}"
          echo "OO_PS4_TOOLCHAIN=$ROOT" >> "$GITHUB_ENV"
          echo "$ROOT/bin/linux" >> "$GITHUB_PATH"
          echo "Toolchain encontrada: $ROOT"

      - name: Baixar GoldHEN SDK
        run: |
          git clone --depth 1 https://github.com/GoldHEN/GoldHEN_Plugins_SDK.git "$RUNNER_TEMP/GoldHEN_SDK"
          echo "GOLDHEN_SDK=$RUNNER_TEMP/GoldHEN_SDK" >> "$GITHUB_ENV"

      - name: Baixar estrutura oficial
        run: |
          git clone --depth 1 https://github.com/GoldHEN/GoldHEN_Plugins.git "$RUNNER_TEMP/GoldHEN_Plugins"

      - name: Preparar plugin
        run: |
          set -e

          test -f source/main.c
          test -f source/pad.h
          test -f source/config.h
          test -f source/menu.h
          test -f source/menu.c

          ROOT="$RUNNER_TEMP/GoldHEN_Plugins"
          TEMPLATE="$ROOT/plugin_src/plugin_template"

          test -d "$TEMPLATE"

          find "$ROOT/plugin_src" -mindepth 1 -maxdepth 1 -type d ! -name plugin_template -exec rm -rf {} +

          mkdir -p "$TEMPLATE/include"

          cp source/main.c "$TEMPLATE/source/main.c"
          cp source/menu.c "$TEMPLATE/source/menu.c"
          cp source/pad.h "$TEMPLATE/include/pad.h"
          cp source/config.h "$TEMPLATE/include/config.h"
          cp source/menu.h "$TEMPLATE/include/menu.h"

          sed -i 's/-lSceSysmodule/-lSceSysmodule -lScePad -lSceUserService/' "$TEMPLATE/Makefile"

          mv "$TEMPLATE" "$ROOT/plugin_src/DaysGoneSpawner"

      - name: Compilar PRX
        run: |
          make -C "$RUNNER_TEMP/GoldHEN_Plugins"

      - name: Salvar plugin
        uses: actions/upload-artifact@v4
        with:
          name: DaysGoneSpawner
          path: ${{ runner.temp }}/GoldHEN_Plugins/bin/plugins/prx_final/DaysGoneSpawner.prx
          if-no-files-found: error
          
